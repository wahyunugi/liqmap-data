name: research

# Uji riset yang butuh arsip Binance 5 menit sejak 2020 (hanya ada di cache GitHub Actions). Jalan manual saja.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ambil arsip Binance dari cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/binance
          key: binance-none
          restore-keys: binance-
      - name: Uji peta likuidasi vs arah harga
        run: |
          pip install --quiet -r requirements.txt
          python history/binance_public.py
          python research/magnet_test.py
      - name: Simpan hasil
        run: |
          git config user.name "liqmap-bot"
          git config user.email "liqmap-bot@users.noreply.github.com"
          git add research/results
          if git diff --cached --quiet; then echo "tidak ada perubahan"; else
            git commit -m "research: hasil uji peta likuidasi $(date -u +%Y-%m-%d)"; git pull --rebase; git push; fi
