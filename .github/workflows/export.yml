name: export

# Ringkasan harian sejak 2020 dari arsip publik Binance -> data/derived/<SIMBOL>_1d.csv (untuk analisis).
# Jalan manual (Actions -> export -> Run workflow) dan sekali seminggu (Senin 01:23 UTC).
on:
  workflow_dispatch: {}
  schedule:
    - cron: "23 1 * * 1"

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main            # versi terbaru saat jalan mulai, bukan saat dipicu (jalan yang antre bisa tertinggal)
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Ambil arsip Binance dari cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/binance
          key: binance-none
          restore-keys: binance-
      - name: Ringkasan harian
        run: |
          pip install --quiet -r requirements.txt
          python history/binance_public.py
          python history/export_daily.py
      - name: Simpan ke repository
        run: |
          bash collector/save_push.sh "derived: ringkasan harian $(date -u +%Y-%m-%d)" data/derived
