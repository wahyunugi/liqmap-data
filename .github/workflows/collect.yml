name: collect

# Jalan otomatis tiap jam (menit ke-17 agar tidak bertabrakan dengan antrean jam bulat GitHub),
# dan bisa dijalankan manual dari tab Actions -> collect -> Run workflow.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ambil data dari Coinalyze
        env:
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
        run: python collector/coinalyze.py

      - name: Ambil laporan mingguan CFTC (posisi institusi di CME; gagal tidak menghentikan pengumpulan)
        if: always()
        continue-on-error: true
        run: python collector/cftc.py

      - name: Hitung heatmap replika (model v6) dan simpan level aktif
        if: always()
        run: |
          pip install --quiet -r requirements.txt
          python heatmap/snapshot.py --save-history

      - name: Cek arti kolom l/s (tidak mengubah data)
        if: always()
        run: python collector/check_sides.py || true

      - name: Cek kesehatan data (gagal = email bila data berhenti masuk atau repo mendekati 1 GB)
        id: health
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export REPO_SIZE_KB=$(gh api "repos/${{ github.repository }}" --jq .size 2>/dev/null || echo "")
          python collector/health.py

      - name: Simpan ke repository
        if: always()
        run: |
          git config user.name "liqmap-bot"
          git config user.email "liqmap-bot@users.noreply.github.com"
          git add data logs
          if git diff --cached --quiet; then
            echo "tidak ada data baru"
          else
            git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi

      - name: Laporkan hasil cek kesehatan
        if: always() && steps.health.outcome == 'failure'
        run: |
          echo "::error::Cek kesehatan data gagal; lihat langkah 'Cek kesehatan data' di atas."
          exit 1
