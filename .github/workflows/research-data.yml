name: research-data

# Mengunduh data riset tambahan (koin lain per jam dari arsip Binance + data makro FRED) ke research/data. Jalan manual.
on:
  workflow_dispatch:
    inputs:
      what:
        description: "alts (koin lain + makro) atau extra (likuidasi, saldo bursa, perhatian publik)"
        type: choice
        options: [extra, alts]
        default: extra

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unduh dan ringkas
        env:
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
        run: |
          pip install --quiet -r requirements.txt
          if [ "${{ inputs.what }}" = "alts" ]; then python research/fetch_alts.py; else python research/fetch_extra.py; fi
      - name: Simpan hasil
        run: |
          git config user.name "liqmap-bot"
          git config user.email "liqmap-bot@users.noreply.github.com"
          git add research/data
          if git diff --cached --quiet; then echo "tidak ada perubahan"; else
            git commit -m "research: data riset (${{ inputs.what }}) $(date -u +%Y-%m-%d)"; git pull --rebase; git push; fi
